
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Flags Using CSS Grid</title>

    <style>
        body {
            margin: 0;
            font-family: 'Helvetica Neue', sans-serif;
            background-color: gray;
        }

        header {
            background-color: #222;
            color: white;
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            letter-spacing: 0.05rem;
            text-transform: uppercase;
        }

        header h1 {
            margin: 0;
            font-weight: 400;
        }

        main {
            display: grid;
            grid-template-columns: .1fr .1fr 1fr .1fr;
            margin-top: 20px;
        }

        hr {
            width: 100%;
            grid-column: 1 / 5;
        }

        h2 {
            grid-column: 2 / 3;
        }

        /* CHILE FLAG */

        #chile {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            width: 300px;
            height: 200px;
        }

        #blue {
            background: blue;
            grid-column: 1 / 2;
            display: grid;
            align-items: center;
            justify-items: center;
        }

        #white {
            background: white;
            grid-column: 2 / 4;
        }

        #red {
            background: red;
            grid-column: 1 / 4;
        }

        .star {
            width: 70px;
            aspect-ratio: 1;
            background: white;
            clip-path: polygon(
                50% 0,
                79% 90%,
                2% 35%,
                98% 35%,
                21% 90%
            );
        }

        /* DENMARK FLAG */

        #denmark {
            display: grid;
            grid-template-columns: 90px 30px 180px;
            grid-template-rows: 85px 30px 85px;
            width: 300px;
            height: 200px;
            background-color: white;
        }

        #dred1 {
            background-color: #c8102e;
            grid-column: 1;
            grid-row: 1;
        }

        #dred2 {
            background-color: #c8102e;
            grid-column: 3;
            grid-row: 1;
        }

        #dred3 {
            background-color: #c8102e;
            grid-column: 1;
            grid-row: 3;
        }

        #dred4 {
            background-color: #c8102e;
            grid-column: 3;
            grid-row: 3;
        }

        /* FINLAND FLAG */

        #finland {
            display: grid;
            grid-template-columns: 90px 40px 170px;
            grid-template-rows: 80px 40px 80px;
            width: 300px;
            height: 200px;
            background-color: #002f6c;
        }

        #fwhite1 {
            background-color: white;
            grid-column: 1;
            grid-row: 1;
        }

        #fwhite2 {
            background-color: white;
            grid-column: 3;
            grid-row: 1;
        }

        #fwhite3 {
            background-color: white;
            grid-column: 1;
            grid-row: 3;
        }

        #fwhite4 {
            background-color: white;
            grid-column: 3;
            grid-row: 3;
        }

        /* BENIN FLAG */

        #benin {
            display: grid;
            grid-template-columns: 120px 180px;
            grid-template-rows: 100px 100px;
            width: 300px;
            height: 200px;
        }

        #bgreen {
            background-color: #008751;
            grid-column: 1;
            grid-row: 1 / 3;
        }

        #byellow {
            background-color: #fcd116;
            grid-column: 2;
            grid-row: 1;
        }

        #bred {
            background-color: #e8112d;
            grid-column: 2;
            grid-row: 2;
        }

    </style>
</head>

<body>
    <header>
        <h1>Using CSS Grid to make Country Flags</h1>
    </header>

    <main>
        <h2>Chile</h2>
        <div id="chile">
            <div id="blue">
                <div class="star"></div>
            </div>
            <div id="white"></div>
            <div id="red"></div>
        </div>
        <hr>

        <h2>Denmark</h2>
        <div id="denmark">
            <div id="dred1"></div>
            <div id="dred2"></div>
            <div id="dred3"></div>
            <div id="dred4"></div>
        </div>
        <hr>

        <h2>Finland</h2>
        <div id="finland">
            <div id="fwhite1"></div>
            <div id="fwhite2"></div>
            <div id="fwhite3"></div>
            <div id="fwhite4"></div>
        </div>
        <hr>

        <h2>Benin</h2>
        <div id="benin">
            <div id="bgreen"></div>
            <div id="byellow"></div>
            <div id="bred"></div>
        </div>
        <hr>
    </main>
</body>

</html>
