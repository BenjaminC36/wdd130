
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: rgb(120, 96, 64);
            font-family: Georgia, 'Times New Roman', serif;
        }

        #formContainer {
            width: 420px;
            max-width: 95%;
            margin: 17px auto;
            background: white;
            border: 10px solid #092b78;
            border-radius: 30px;
            overflow: hidden;
        }

        .banner {
            height: 170px;
            background-color: #8c8068;
            background-image: url("images/jesus_feeds_5000.jpeg");
            background-size: cover;
            background-position: center;
            position: relative;
            display: grid;
            place-items: center;
            text-align: center;
        }

        .banner h1 {
            color: white;
            font-size: 30px;
            line-height: 1.1;
            text-shadow: 2px 2px 3px black;
            margin: 0;
        }

        #closeBtn {
            position: absolute;
            top: 12px;
            left: 14px;
            font-size: 18px;
            cursor: pointer;
        }

        h3 {
            text-align: center;
            font-size: 18px;
            margin: 20px 0;
        }

        #myForm {
            padding: 0 20px 20px;
            display: grid;
            grid-template-columns: 1fr 170px;
            gap: 20px 12px;
            align-items: center;
        }

        #myForm > label {
            font-size: 16px;
        }

        #myForm > input {
            width: 100%;
            height: 23px;
        }

        .genderOptions {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .genderOptions label {
            margin-right: 2px;
        }

        .fullRow {
            grid-column: 1 / 3;
            text-align: center;
        }

        .fullRow label {
            cursor: pointer;
        }

        .submitRow {
            margin-top: 2px;
        }

        .submitRow button {
            cursor: pointer;
            padding: 3px 10px;
        }

        .scriptures {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            background: white;
        }

        .scripture {
            background: #181818;
            color: #c9a66b;
            min-height: 100px;
            text-align: center;
            padding: 12px 3px;
            font-size: 11px;
            text-transform: uppercase;
        }

        .scripture span {
            display: block;
            border-top: 1px solid #987747;
            border-bottom: 1px solid #987747;
            padding: 4px 0;
        }

        #output {
            color: white;
            max-width: 500px;
            margin: 20px auto;
        }

        #output li {
            margin: 5px 0;
        }
    </style>
</head>

<body>

    <div id="formContainer">

        <div class="banner">
            <button type="button" id="closeBtn">X</button>
            <h1>Daily Feed<br>Scripture a Day</h1>
        </div>

        <h3>Sign Up for Daily Scripture Feed</h3>

        <form id="myForm">

            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>
            <div class="genderOptions">
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section class="fullRow">
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section class="fullRow">
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section class="fullRow submitRow">
                <button type="submit">Submit</button>
            </section>

        </form>

        <div class="scriptures">
            <div class="scripture"><span>Old<br>Testament</span></div>
            <div class="scripture"><span>New<br>Testament</span></div>
            <div class="scripture"><span>Book<br>of<br>Mormon</span></div>
            <div class="scripture"><span>Doctrine<br>and<br>Covenants</span></div>
            <div class="scripture"><span>Pearl of<br>Great Price</span></div>
        </div>

    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
        });

        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault();

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
        });
    </script>

</body>
</html>
